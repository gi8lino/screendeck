---
name: Unit Tests

on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - "internal/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "scripts/web/**"
      - "scripts/e2e/**"
      - "test/e2e/**"
      - "Makefile"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Download dependencies
        run: make download

      - name: Build and check frontend
        run: make check-web

      - name: Check formatting and static analysis
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -checks=inherit,-ST1005 ./...
          git diff --check

      - name: Run unit tests
        run: make test

      - name: Install browser test dependencies
        run: make playwright-browser-ci

      - name: Run browser behavior tests
        run: make test-e2e
