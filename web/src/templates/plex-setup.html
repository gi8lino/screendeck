<template id="plex-setup-template">
  <section class="panel">
    <div class="eyebrow">Plex connection</div>
    <h2>Authorize this device.</h2>
    <p class="lede">
      Plex opens in a separate window. Sign in there, then return here to select
      the media server you want to use.
    </p>
    <p class="notice" data-ref="status">Ready to connect.</p>
    <div class="server-list" data-ref="servers"></div>
    <div class="actions" data-ref="authActions">
      <button class="btn primary" type="button" data-ref="standardButton">
        Sign in with Plex
      </button>
    </div>
  </section>
</template>
