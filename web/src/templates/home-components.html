<template id="saved-room-list-template">
  <div class="saved-room-list"></div>
</template>

<template id="saved-room-template">
  <button class="saved-room" type="button">
    <span class="saved-room-main">
      <span class="saved-room-heading">
        <strong class="saved-room-code" data-ref="code"></strong>
        <span class="saved-room-role" data-ref="role"></span>
      </span>
      <span class="saved-room-meta" data-ref="meta"></span>
    </span>
    <span class="saved-room-open">Open →</span>
  </button>
</template>

<template id="saved-rooms-toggle-template">
  <button class="saved-rooms-toggle" type="button"></button>
</template>
