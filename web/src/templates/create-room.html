<template id="create-room-template">
  <section class="panel">
    <div class="eyebrow">Host a room</div>
    <h2>Shape the watchlist.</h2>

    <form data-ref="form">
      <div class="form-row">
        <label for="create-room-name">Your name</label>
        <input
          id="create-room-name"
          data-ref="name"
          type="text"
          maxlength="30"
          placeholder="Ripley"
          autocomplete="nickname"
          required
        />
      </div>

      <div class="form-row">
        <div class="label">Movie and TV libraries</div>
        <div class="checks" data-ref="libraries">
          <div class="empty">Loading Plex libraries…</div>
        </div>
      </div>

      <section class="filter-box preference-box">
        <div class="label">Your genres</div>
        <p class="muted">
          Optional · these only filter your own swipe deck. Leave empty to see
          every room title.
        </p>
        <select data-ref="genreMode" aria-label="Personal genre matching">
          <option value="any">Match any selected genre</option>
          <option value="all">Match all selected genres</option>
        </select>
        <div
          class="genre-chips"
          data-ref="personalGenres"
          role="group"
          aria-label="Your genres"
        ></div>
      </section>

      <section class="filter-box">
        <div class="label">Room filters</div>
        <p class="muted" data-ref="filterStatus">
          Choose at least one library to load its filters.
        </p>

        <div class="form-row compact">
          <label for="sampling-strategy">First-round selection</label>
          <select id="sampling-strategy" data-ref="samplingStrategy">
            <option value="random">Random</option>
            <option value="highest_rated">Highest rated</option>
            <option value="recently_added">Recently added</option>
            <option value="random_unwatched">Random unwatched</option>
          </select>
          <p class="muted">
            Choose how ScreenDeck picks and orders titles before applying the
            first-round limit.
          </p>
        </div>

        <div class="form-row compact">
          <label for="round-size">Maximum titles in the first round</label>
          <select id="round-size" data-ref="roundSize">
            <option value="50">50 titles</option>
            <option value="100">100 titles</option>
            <option value="250" selected>250 titles · recommended</option>
            <option value="500">500 titles</option>
            <option value="0">All matching titles</option>
          </select>
          <p class="muted">
            Applied after room filters and shuffling. You can ask the group to
            narrow to the current matches at any time.
          </p>
        </div>

        <div class="form-row compact">
          <div class="label">Room genres · select any that fit</div>
          <div
            class="genre-chips"
            data-ref="roomGenres"
            role="group"
            aria-label="Room genres"
          ></div>
        </div>

        <div class="range-grid">
          <div class="mini-field">
            <label for="year-from">From year</label>
            <input
              id="year-from"
              data-ref="yearFrom"
              type="number"
              min="0"
              placeholder="1900"
            />
          </div>
          <div class="mini-field">
            <label for="year-to">To year</label>
            <input id="year-to" data-ref="yearTo" type="number" min="0" />
          </div>
          <div class="mini-field">
            <label for="max-duration">Maximum movie length</label>
            <input
              id="max-duration"
              data-ref="duration"
              type="number"
              min="0"
              placeholder="Minutes"
            />
          </div>
        </div>

        <label class="check">
          <input data-ref="unwatchedOnly" type="checkbox" />
          <span>Only include fully unwatched titles</span>
        </label>
      </section>

      <p class="error" data-ref="error"></p>
      <button class="btn primary" type="submit" data-ref="submit">
        Create room
      </button>
    </form>
  </section>
</template>
