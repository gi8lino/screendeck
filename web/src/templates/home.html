<template id="home-template">
  <section class="hero home-hero">
    <div class="eyebrow">Tonight, decided.</div>
    <h1>Stop scrolling. Start watching.</h1>
    <p class="lede">
      Invite your people, swipe through movies and TV shows from Plex, and find
      what everyone actually wants to watch.
    </p>
    <div class="notice" data-ref="plexNotice" hidden>
      Connect a Plex account to choose a server and load its movie and TV
      libraries. Credentials stay encrypted on this server.
    </div>
    <div class="actions">
      <button class="btn primary" type="button" data-ref="primaryAction">
        Create a room
      </button>
      <button class="btn ghost" type="button" data-ref="joinAction">
        Join friends
      </button>
    </div>
  </section>

  <section class="saved-rooms" data-ref="savedRooms">
    <div class="saved-rooms-head">
      <div>
        <div class="eyebrow">Your rooms</div>
        <h2>Pick up where you left off.</h2>
      </div>
    </div>
    <div class="empty saved-rooms-loading">Loading your rooms…</div>
  </section>
</template>
