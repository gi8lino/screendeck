<template id="home-template">
  <section class="hero home-hero">
    <div class="eyebrow">Tonight, decided.</div>
    <h1>Stop scrolling. Start watching.</h1>
    <p class="lede">
      Invite your people, swipe through movies and TV shows from Plex or Jellyfin,
      and find what everyone actually wants to watch.
    </p>
    <div class="notice" data-ref="networkWarning" hidden>
      This ScreenDeck server is listening beyond loopback. ScreenDeck has no
      built-in user authentication, so keep it on a trusted private network or
      protect it with HTTPS and upstream access control.
    </div>
    <div class="notice" data-ref="mediaNotice" hidden>
      Connect Plex or Jellyfin to load your movie and TV libraries. Media-server
      access tokens stay encrypted on this ScreenDeck server.
    </div>
    <div class="actions">
      <button class="btn primary" type="button" data-ref="primaryAction">
        Create a room
      </button>
      <button class="btn ghost" type="button" data-ref="joinAction">
        Join friends
      </button>
    </div>
  </section>

  <section class="saved-rooms" data-ref="savedRooms">
    <div class="saved-rooms-head">
      <div>
        <div class="eyebrow">Your rooms</div>
        <h2>Pick up where you left off.</h2>
      </div>
    </div>
    <div class="empty saved-rooms-loading">Loading your rooms…</div>
  </section>
</template>
