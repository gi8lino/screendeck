site_name: ScreenDeck
site_description: A self-hosted Plex picker that helps a group agree on a movie or TV show.
site_url: https://gi8lino.github.io/screendeck/

repo_url: https://github.com/gi8lino/screendeck
repo_name: gi8lino/screendeck
edit_uri: edit/main/docs/content/

docs_dir: content
site_dir: .site

theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.select

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - awesome-nav

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
