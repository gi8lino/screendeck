---
project_name: screendeck
version: 2

before:
  hooks:
    - make web
    - go mod tidy

builds:
  - id: screendeck
    main: ./cmd
    binary: screendeck
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Version={{ .Tag }}
      - -X main.Commit={{ .FullCommit }}

dockers_v2:
  - id: screendeck
    ids:
      - screendeck
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.description: "{{ .ProjectName }}"
      org.opencontainers.image.licenses: "NOASSERTION"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/gi8lino/screendeck"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.url: "https://github.com/gi8lino/screendeck"
      org.opencontainers.image.version: "{{ .Tag }}"
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/gi8lino/screendeck
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
